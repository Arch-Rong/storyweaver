[project]
name = "storyweaver"
version = "0.1.0"
description = "StoryWeaver novel collaboration agent backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "platformdirs>=4.0",
    "tiktoken>=0.7",
]

[project.scripts]
storyweaver = "storyweaver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storyweaver"]

[tool.hatch.build.targets.sdist]
include = ["src/storyweaver"]
